services:
  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irenesbot"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - irenesbot-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?VariableNotSet}
      - POSTGRES_DB=irenesbot
    ports:
      - 5431:5432
      # 5432 port is taken by PgAdmin

volumes:
  irenesbot-db-data: