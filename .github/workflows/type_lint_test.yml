name: Type, Lint, Test

on:
  # `main` runs these checks as part of `deploy_service.yml` (which only deploys when they pass), not on its own.
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
  workflow_dispatch:

jobs:
  type-test-lint:
    runs-on: ubuntu-latest
    services:
      # a throwaway PostgreSQL for tests/test_sql.py
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Checkout Dota2Bot's migrations
        uses: actions/checkout@v6
        with:
          repository: AluBot/Dota2Bot
          path: .deps/Dota2Bot
          sparse-checkout: migrations

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ty Type Checking
        run: uv run ty check src tests --output-format github

      - name: Ruff Lint Checking
        run: uv run ruff check src tests templates --output-format github

      - name: Ruff Format Checking
        run: uv run ruff format --check src tests templates

      - name: Pytest Tests
        run: uv run pytest
        env:
          SQL_CHECK_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
          DOTA2BOT_MIGRATIONS: .deps/Dota2Bot/migrations
          # it doesn't need any real .env values for the most of it, just so pydantic doesn't crash out
          PROJECT_NAME: irenesbot
          TWITCH_CLIENT_ID: str
          TWITCH_CLIENT_SECRET: str
          TEST_TWITCH_CLIENT_ID: str
          TEST_TWITCH_CLIENT_SECRET: str
          DATABASE_URL: str
          SEVEN_TV_BEARER: ${{ secrets.SEVEN_TV_BEARER }}
          STV_TOKEN_PAGE_KEY: str
          STEAM_API_KEY: str
          SPOTIFY_AIDENWALLIS: str
          EVENTSUB: str
          WEBHOOK_LOGGER: str
          WEBHOOK_ERROR: str
          WEBHOOK_STREAM_NOTIF: str
          WEBHOOK_SPAM: str
          LOCAL_API_KEY: str
